name: Fetch approved Nightstands still v2
on:
  push:
    branches: [cinefest-family-2026]
    paths: ['.github/workflows/cinefest-fetch-nightstands-cloudflare-v2.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cinefest-family-2026
      - name: Fetch approved local Cinéfest still
        run: |
          mkdir -p cinefest-assets
          curl -fL --max-time 30 'https://union-atmospheric-vsnet-depending.trycloudflare.com/nightstands-approved.jpg' -o cinefest-assets/nightstands-approved.jpg
          file cinefest-assets/nightstands-approved.jpg
          test $(stat -c%s cinefest-assets/nightstands-approved.jpg) -gt 100000
      - name: Commit image asset
        run: |
          git config user.name 'cinefest-publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add cinefest-assets/nightstands-approved.jpg
          git commit -m 'Add approved Nightstands Cinéfest still'
          git push origin cinefest-family-2026